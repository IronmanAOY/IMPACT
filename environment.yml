name: impact-synergy-clean
# Reference environment for the IMPaCT Synergy Pipeline (Python 3.10).
#
# Minor versions are pinned to the stack the test suite was verified on
# (conda env impact-synergy-clean, osx-arm64, 2026-09-28). pyproject.toml
# declares compatible ranges for pip installs; keep both files in step.
#
#   conda env create -f environment.yml      # or: mamba env create -f ...
#   conda activate impact-synergy-clean
#   python -m pip install --no-deps --no-build-isolation -e .
#
# Not included on purpose:
#   - CuPy (GPU/APU backend): must match the site's CUDA/ROCm stack; on HLRS
#     Hunter it is built separately (see the Hunter documentation).
#   - DataLad/git-annex (scripts/download_data.sh) and Docker (fMRIPrep):
#     system tools, installed outside this environment.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - setuptools>=77
  # Core numerical stack. numba 0.61.2 supports NumPy <2.3; MNE 1.6.1 was
  # checked on NumPy 2.2 for the reader/filter/resample calls the pipeline uses.
  - numpy=2.2.*
  - scipy=1.15.*
  - pandas=2.3.*
  - scikit-learn=1.7.*
  - statsmodels=0.14.*
  - numba=0.61.*
  # Neuroimaging I/O and preprocessing
  - nibabel=5.3.*
  - nilearn=0.13.*
  - mne-base=1.6.*
  - pybids=0.21.*
  # Graph metrics, reporting, dashboard
  - networkx=3.4.*
  - python-louvain=0.16
  - python-docx=1.2.*
  - matplotlib-base=3.10.*
  - psutil>=5.9
  # MPC-Bench v2 system catalogue (witnesses_v2.yaml)
  - pyyaml>=6
  # Test and lint tooling (used by CI)
  - pytest>=7
  - pytest-timeout>=2.1
  - flake8=7.3.*
