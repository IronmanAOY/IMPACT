name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install flake8
        run: python -m pip install "flake8==7.3.0"
      # Syntax errors, invalid comparisons and undefined names only; the full
      # style config in .flake8 is advisory until the legacy code is cleaned up.
      - name: flake8 (error classes)
        run: python -m flake8 --select=E9,F63,F7,F821,F822,F823 --show-source --statistics .
      - name: Shell script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # setup-miniconda activates the environment only in login shells.
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: impact-synergy-clean
          auto-activate: false
          conda-remove-defaults: "true"

      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Show environment
        run: |
          conda info
          python -c "import importlib.metadata as m; print('impact-synergy-pipeline', m.version('impact-synergy-pipeline'))"
          conda list | grep -E "^(python|numpy|scipy|pandas|nilearn|mne-base|numba|pybids) "

      - name: Test
        timeout-minutes: 30
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba_cache
        run: python -m pytest -q -p no:cacheprovider --timeout=900 --durations=10
