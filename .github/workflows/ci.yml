name: CI
on:
  push:
    branches: [main, polish/hlrs-handoff-2026-09]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install flake8
        run: python -m pip install "flake8==7.3.0"
      - name: flake8
        run: python -m flake8 --show-source --statistics .
      - name: Shell script syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # setup-miniconda activates the environment only in login shells.
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Full history and tags: some tests read files from earlier commits
      # and from the freeze tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: impact-synergy-clean
          auto-activate: false
          conda-remove-defaults: "true"

      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Show environment
        run: |
          conda info
          python -c "import importlib.metadata as m; print('impact-synergy-pipeline', m.version('impact-synergy-pipeline'))"
          conda list | grep -E "^(python|numpy|scipy|pandas|nilearn|mne-base|numba|pybids) "

      - name: Test
        timeout-minutes: 50
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba_cache
        run: python -m pytest -q -p no:cacheprovider --timeout=900 --durations=10
