# IMPaCT paper-2 executable hypothesis registry.
#
# Schema: predictions/registry.schema.json. Evaluated by scripts/run_predictions.py,
# which refuses results produced by estimator versions or protocol hashes that
# are not registered here, refuses confirmatory evaluation while the registry is a
# draft, and never lets data with prior access contribute to a confirmatory
# outcome.
#
# Stance: necessary conditions license only exclusion. EXCLUDED means
# some principle of the necessity set is credibly ABSENT; MPC_CONSISTENT means
# consciousness is not excluded by the MPC stance (no attribution);
# UNDETERMINED otherwise. v1 names (ATTRIBUTED / NOT_ATTRIBUTED) are accepted and
# mapped. H2 (aggregation exponent) is auxiliary and never counts for or against
# the stance.
#
# Decision rules (impact_pipeline.necessity; one-sided exact Clopper-Pearson
# bounds at level 1 - alpha):
#   symmetric_necessity:    FALSIFIED if lower(ABSENT rate | report+) > tau;
#                           SUPPORTED if upper < tau and the component varies
#                           (>= 1 ABSENT among report-negative episodes);
#                           else INDETERMINATE.
#   symmetric_upper_lower:  the same without the variation requirement
#                           (margin epsilon or kappa).
#   null_calibration (H0):  one-sided calibration of the false-PRESENT rate
#                           against alpha + null_band. FALSIFIED if some
#                           (null family, regime, principle) cell's lower bound
#                           at level alpha / m (m cells; family-wise) exceeds
#                           the bound; SUPPORTED otherwise if every principle's
#                           upper bound (level alpha / P) of its rate pooled
#                           over its cells is below the bound; else
#                           INDETERMINATE. Does not degrade with the number of
#                           cells; rates far below alpha count as calibrated.
#   non_inferiority (H10):  paired bootstrap of the gap in selective accuracy
#                           of exclusion claims (see H10).
#   Every decision is INDETERMINATE below the registered minimum_n. A
#   minimum_n marked provisional must be confirmed before the freeze.
#
# Missing evidence and the stance (defaults.stance_falsification:
# sensitivity_confirmed; companion article, Sections 3 and 9 and the
# supplementary preregistration). The primary analysis of H1 and H3-H7 drops
# UNDEFINED statuses / UNDETERMINED verdicts from the denominator; the
# registered worst-case sensitivity analysis (sensitivity_missing: worst_case)
# counts every such report-positive episode as ABSENT (EXCLUDED) for the upper
# bound and as not ABSENT (not EXCLUDED) for the lower bound. INCONCLUSIVE
# statuses are UNDEFINED, so a weakly expressed capacity can inflate the
# primary rate when necessity holds: a FALSIFIED outcome of H1 or H3-H7 counts
# against the stance only if the worst-case sensitivity analysis also returns
# FALSIFIED (otherwise the stance summary lists it as falsified_not_confirmed).
# H8 has no missingness dimension (every labelled report-positive episode is
# in its denominator), so its FALSIFIED outcome counts as evaluated. The stance
# summary is FALSIFIED if some FALSIFIED outcome counts against the stance,
# SUPPORTED if every counted hypothesis is SUPPORTED, else INDETERMINATE.
#
# Estimator identity: the evidence layer records compute_<P>:<mode>@<version>
# (ComponentEvidence.estimator; mode = the protocol's RAM update, IIM cut_mode
# or the mode of PDI/NAS/SRPI; version = mpc_metrics.ESTIMATOR_VERSIONS). An
# entry below holds the name compute_<P>:<mode> and, once registered, the
# version; run_predictions.py compares both exactly with the results columns
# <P>_estimator and <P>_estimator_version.
#
# Before the freeze: fill the protocol hash (evidence.Protocol JSON of the frozen
# protocol), register the estimator versions validated in the applicability
# registry, drop the pre-release suffix of registry_version, set
# status: frozen and freeze_tag, and commit the tag.
#
# 0.3.0-draft (2026-09-29, after the tag mpcbench-freeze-v1): IIM entry named as
# the evidence layer records it (compute_IIM:bidirectional, not
# compute_IIM:delta_psi); the stance rule above (stance_falsification); the
# frozen construct-scale cutoffs and their keep-unless rule in the protocol
# note. No hypothesis, statistic, margin, minimum n or decision rule changed.

registry_version: "0.3.0-draft"
status: draft
freeze_tag: null
created: "2026-09-28"
description: >-
  Paper-2 confirmatory hypotheses of the IMPaCT measurement framework: null
  calibration (H0), verdict-level non-exclusion of report-positive episodes (H1),
  the auxiliary aggregation exponent (H2), symmetric necessity of each principle
  (H3-H7), the single-source constraint (H8), coverage (H9) and selective accuracy
  against comparators (H10).
spec_refs:
  - "IMPaCT 1.1.0 design specification (2026-09-28)"
  - "IMPaCT 1.1.0 design specification, v2 addendum (2026-09-28)"

verdict_names:
  excluded: EXCLUDED
  consistent: MPC_CONSISTENT
  undetermined: UNDETERMINED
  v1_aliases:
    NOT_ATTRIBUTED: EXCLUDED
    ATTRIBUTED: MPC_CONSISTENT

defaults:
  alpha: 0.05
  tau: 0.05
  epsilon: 0.05
  missing: determinate
  sensitivity_missing: worst_case
  stance_falsification: sensitivity_confirmed
  ci_method: clopper_pearson_one_sided
  null_band: 0.02

protocols:
  - id: mpc-v2-default
    hash: null
    hash_algorithm: evidence.Protocol
    file: protocols/mpc_default_v1.json
    necessity_set: [RAM, PDI, NAS, IIM, SRPI]
    spec:
      cutoffs: {z: 0.25, delta: 0.10}
      scale: two_anchor_c
      alpha: 0.05
      reference: cohort_high_state
      bearer_rule: single_source
    note: >-
      Candidate: protocols/mpc_default_v1.json (not frozen; its evidence.Protocol
      hash goes into 'hash' at the freeze). Construct-scale cutoffs z_j = 0.25 and
      delta_j = 0.10 for every principle and alpha = 0.05, frozen with the
      MPC-Bench protocols at the tag mpcbench-freeze-v1 under the preregistered
      keep-unless rule (docs/preregistration/MPC_BENCH_PREREGISTRATION.md,
      section 4), fixed before the development runs were analysed: keep
      (z, delta, alpha) = (0.25, 0.10, 0.05) unless (i) an anchored principle's
      false-PRESENT rate on a development null class exceeds alpha + 0.02 at z
      (then raise that principle's z to the smallest grid value that meets it)
      or (ii) the nominal positive control is ever ABSENT (then lower delta).
      Neither occurred, so the values were kept. Whether this justification
      transfers to human recordings, where the cutoffs are fractions of an awake
      excess, is checked on forward-modelled dose-response curves (applicability
      registry). The cohort_high_state reference is circular
      for high-state (report-positive) episodes, whose c averages 1 by construction:
      the confirmatory necessity tests (H1, H3-H7) need a protocol with an external
      reference before the freeze.

estimators:
  - principle: RAM
    estimator: "compute_RAM:prediction_error"
    version: null
    registration: pending_validation
    note: >-
      Rescorla-Wagner prediction-error U. Runs without a choice/reward log use the
      protocol's declared fallback (compute_RAM:feedback_magnitude); results from an
      unregistered fallback estimator are refused unless it is registered too.
      Decision at the paper-1 freeze (2026-09-28): the fallback is deliberately not
      registered (its U is undefined for +-1 feedback and it was not validated on
      MPC-Bench), so fallback rows stay refused; registering it needs its own
      validation.
  - principle: PDI
    estimator: "compute_PDI:repertoire"
    version: null
    registration: pending_validation
    note: >-
      Unlabelled repertoire of distinguishable states (bits over its state-count
      null). surrogate_excess is a documented negative result and is not
      registered. Human EEG/fMRI entries need forward-model validation.
  - principle: NAS
    estimator: "compute_NAS:capacity"
    version: null
    registration: pending_validation
  - principle: IIM
    estimator: "compute_IIM:bidirectional"
    version: null
    registration: pending_validation
    note: >-
      Delta_Psi (bits) against circular-shift surrogates, with the bidirectional
      system cuts declared by the protocol (cut_mode; the evidence layer records
      compute_IIM:<cut_mode>@<version>, e.g.
      compute_IIM:bidirectional@iim-v4-2026.09 at the tag). Registry 0.2.0 named
      it compute_IIM:delta_psi, which no pipeline row carries. The directional
      cut (compute_IIM:directional) is not registered.
  - principle: SRPI
    estimator: "compute_SRPI:agency"
    version: null
    registration: pending_validation
    note: >-
      Runs without self_caused/other_caused events use the protocol's declared
      legacy fallback (compute_SRPI:legacy), which must be registered separately to
      contribute confirmatory results. Decision at the paper-1 freeze (2026-09-28):
      the legacy fallback is deliberately not registered (hard zeros, one-sided
      reactivity; the motivating failure of SRPI-agency), so fallback rows stay
      refused.

