hypotheses:
  - id: H0
    title: Every registered estimator is calibrated on its declared null family
    level: measurement
    counts_for_stance: false
    statistic: null_false_present_rate
    decision: null_calibration
    minimum_n: 460
    minimum_n_status: provisional
    minimum_n_source: >-
      Minimum replicates per (null family, regime, principle) cell: a 95% Wald
      half-width of 0.02 at a rate of 0.05 (1.96^2 * 0.05 * 0.95 / 0.02^2 = 456).
      Not a power computation for the pooled rule.
    prediction: >-
      The false-PRESENT rate on the declared null families is at most alpha + 0.02
      (entry criterion (a) of the applicability registry, one-sided): no cell
      credibly above it (family-wise) and every principle's pooled rate
      credibly below it.
    note: >-
      Evaluated on scripts/null_calibration.py output (--null-calibration; v2
      evidence rule under the bench protocol, jackknife SEs); NOT_EVALUABLE when a
      cell's statuses come from another rule (status_impl, e.g. the legacy_v1
      diagnostic). One-sided because a calibrated v2 rule (PRESENT needs
      c_lower > z) has a false-PRESENT rate far below alpha; the pooled
      per-principle criterion with family-wise per-cell falsification does not
      become harder to meet as cells are added (the former all-cells-within-band
      rule was almost never met with many cells).

  - id: H1
    title: Report-positive episodes are (almost) never EXCLUDED
    level: verdict
    counts_for_stance: true
    statistic: excluded_rate_report_positive
    decision: symmetric_upper_lower
    population: report_positive
    epsilon: 0.05
    minimum_n: 286
    minimum_n_status: provisional
    minimum_n_source: >-
      scripts/necessity_power.py --level verdict at power_assumptions: n_stable for
      80% power, the maximum over the necessity-holds and violated truths (the
      value the script produces; provisional until the freeze). The EXCLUDED rate
      among report-positive episodes is (1 - lambda) e_c + lambda e_u with e_u = 1
      (worst case: every mislabelled unconscious episode EXCLUDED), i.e. 0.02 when
      necessity holds; the draft value 155 (borrowed from H3-H7) had a SUPPORTED
      probability of about 0.62.
    power_assumptions:
      level: verdict
      tau: 0.05
      alpha: 0.05
      pi_nec: 0.0
      pi_viol: 0.25
      pi_unconscious: 0.6
      label_noise: 0.02
      base_rate: 0.5
      coverage: 0.8
      sensitivity: 0.9
      false_absent: 0.0
      n_principles: 5
      excluded_unconscious: 1.0
      target_power: 0.8
    supported_if: upper bound of the EXCLUDED rate among determinate report-positive episodes < 0.05
    falsified_if: lower bound of the EXCLUDED rate among determinate report-positive episodes > 0.05

  - id: H2
    title: Aggregation exponent of the MPC degree (auxiliary)
    level: auxiliary
    counts_for_stance: false
    statistic: aggregation_exponent
    decision: auxiliary_report
    outcome_column: outcome_graded
    minimum_n: 200
    minimum_n_source: >-
      scripts/simulate_rule_recovery.py: p is weakly identifiable; measurement error
      biases it towards compensatory (arithmetic) aggregation.
    note: Reported with its profile-likelihood interval; never counts for or against the stance.

  - id: H3
    title: RAM is necessary (symmetric necessity criterion)
    level: component
    counts_for_stance: true
    statistic: absent_rate_report_positive
    decision: symmetric_necessity
    principle: RAM
    population: report_positive
    tau: 0.05
    variation_floor: 0.0
    minimum_n: 155
    minimum_n_source: scripts/necessity_power.py with power_assumptions (n_stable, power 0.8)
    power_assumptions: &power
      tau: 0.05
      alpha: 0.05
      pi_nec: 0.0
      pi_viol: 0.25
      pi_unconscious: 0.6
      label_noise: 0.02
      base_rate: 0.5
      coverage: 0.8
      sensitivity: 0.9
      false_absent: 0.0
      target_power: 0.8

  - id: H4
    title: PDI is necessary (symmetric necessity criterion)
    level: component
    counts_for_stance: true
    statistic: absent_rate_report_positive
    decision: symmetric_necessity
    principle: PDI
    population: report_positive
    tau: 0.05
    variation_floor: 0.0
    minimum_n: 155
    minimum_n_source: scripts/necessity_power.py with power_assumptions (n_stable, power 0.8)
    power_assumptions: *power

  - id: H5
    title: NAS is necessary (symmetric necessity criterion)
    level: component
    counts_for_stance: true
    statistic: absent_rate_report_positive
    decision: symmetric_necessity
    principle: NAS
    population: report_positive
    tau: 0.05
    variation_floor: 0.0
    minimum_n: 155
    minimum_n_source: scripts/necessity_power.py with power_assumptions (n_stable, power 0.8)
    power_assumptions: *power

  - id: H6
    title: IIM is necessary (symmetric necessity criterion)
    level: component
    counts_for_stance: true
    statistic: absent_rate_report_positive
    decision: symmetric_necessity
    principle: IIM
    population: report_positive
    tau: 0.05
    variation_floor: 0.0
    minimum_n: 155
    minimum_n_source: scripts/necessity_power.py with power_assumptions (n_stable, power 0.8)
    power_assumptions: *power

  - id: H7
    title: SRPI is necessary (symmetric necessity criterion)
    level: component
    counts_for_stance: true
    statistic: absent_rate_report_positive
    decision: symmetric_necessity
    principle: SRPI
    population: report_positive
    tau: 0.05
    variation_floor: 0.0
    minimum_n: 155
    minimum_n_source: scripts/necessity_power.py with power_assumptions (n_stable, power 0.8)
    power_assumptions: *power

  - id: H8
    title: Single-source constraint holds in report-positive episodes
    level: verdict
    counts_for_stance: true
    statistic: reason_rate_report_positive
    decision: symmetric_upper_lower
    reason_code: SOURCE_INCOHERENT
    population: report_positive
    epsilon: 0.05
    minimum_n: 155
    minimum_n_source: same value as H3-H7; no power computation for this statistic yet
    note: >-
      Joint dependence of the component node sets above the between-set null
      (single-source constraint); SOURCE_INCOHERENT is read from the MPC_reason
      column.

  - id: H9
    title: The verdict is determinate for at least half of the episodes (coverage)
    level: measurement
    counts_for_stance: false
    statistic: coverage
    decision: symmetric_upper_lower
    necessity_set: [RAM, PDI, NAS, IIM, SRPI]
    population: all
    kappa: 0.5
    minimum_n: 155
    minimum_n_source: same value as H3-H7; no power computation for this statistic yet
    supported_if: lower bound of the determinate fraction > 0.5
    falsified_if: upper bound of the determinate fraction < 0.5

  - id: H10
    title: Exclusion claims are not less accurate than those of single-marker comparators
    level: comparative
    counts_for_stance: false
    statistic: selective_exclusion_accuracy_gap
    decision: non_inferiority
    comparators: [LZc, PhiR, IIM_only, NAS_only]
    margin: 0.05
    min_exclusions: 10
    n_boot: 2000
    seed: 0
    minimum_n: 155
    minimum_n_source: same value as H3-H7; no power computation for this statistic yet
    note: >-
      Only exclusion claims are scored: an EXCLUDED verdict (comparator
      False) is correct on a report-negative and an error on a report-positive
      episode; MPC_CONSISTENT ("not excluded", never an attribution) and
      UNDETERMINED make no claim, so MPC_CONSISTENT on a report-negative episode
      (e.g. covert or disconnected consciousness) is not an error. Selective
      accuracy = fraction of a rule's exclusion claims made on report-negative
      episodes; comparators with fewer than min_exclusions claims are not
      eligible. Reported with it: the EXCLUDED rates among report-positive and
      report-negative episodes of IMPaCT and of each comparator. Comparator
      columns comparator_<name> hold True (not excluded), False (excluded) or
      empty (abstain). Paired bootstrap over episodes; SUPPORTED if the lower
      1-alpha bound of the gap (IMPaCT minus the best comparator) exceeds
      -margin, FALSIFIED if the upper bound is below -margin.
