# Install once with `pre-commit install`; run on everything with
# `pre-commit run --all-files`. Only check-type hooks are used, so hooks never
# rewrite files. The flake8 selection matches the CI lint job (syntax errors and
# undefined names); the full style config in .flake8 is advisory until the
# legacy code base is cleaned up. black is intentionally not enabled: the code
# base has never been black-formatted and a mass reformat would bury real diffs.
exclude: ^(data|outputs|test_objects|dist|atlases|docs/manuscript)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--select=E9,F63,F7,F821,F822,F823"]
